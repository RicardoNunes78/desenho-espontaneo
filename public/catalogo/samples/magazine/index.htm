		<script type="text/javascript">
			function loadApp() {
				$('#all').fadeIn(1000);
		        // Cria o efeito revista:
				$('.magazine').turn({
					// Largura da revista:
					width: 1200, /* 922 */
					// Altura da revista:
					height: 350, /* 650 */
					// Pixel padrão de elevação da orelha da folha:
					elevation: 50,
					// Aceleração de Hardware:
					acceleration: !isChrome(),
					// habilita os gradientes:
					gradients: true,
					// Centraliza a revista:
					autoCenter: true,
// ***************** Número de Páginas:
					pages: 28,
					// Eventos:
					when: {
						turning: function(event, page, view) {
							var book = $(this),
							currentPage = book.turn('page'),
							pages = book.turn('pages');
							// Atualiza o URI atual:
							Hash.go('page/' + page).update();
							// Mostra e esconde os botões de navegação:
							disableControls(page);
							$('.thumbnails .page-'+currentPage).
								parent().
								removeClass('current');
							$('.thumbnails .page-'+page).
								parent().
								addClass('current');
						},
						turned: function(event, page, view) {
							disableControls(page);
							$(this).turn('center');
							if (page==1) {
								$(this).turn('peel', 'br');
						}
					},
					missing: function (event, pages) {
						// Adiciona páginas que não estão na revista:
						for (var i = 0; i < pages.length; i++)
						addPage(pages[i], $(this));
					}
				}
			});
			// Chama o efeito de zoom:
			$('.magazine-viewport').zoom({
				flipbook: $('.magazine'),
				max: function() {
					return largeMagazineWidth()/$('.magazine').width();
				}, 
				when: {
					tap: function(event) {
						if ($(this).zoom('value')==1) {
							$('.magazine').
								removeClass('animated').
								addClass('zoom-in');
							$(this).zoom('zoomIn', event);
						} else {
							$(this).zoom('zoomOut');
						}
					},
					resize: function(event, scale, page, pageElement) {
						if (scale==1)
							loadSmallPage(page, pageElement);
						else
							loadLargePage(page, pageElement);
					},
					zoomIn: function () {
						$('.thumbnails').hide();
						$('.made').hide();
						$('.magazine').addClass('zoom-in');
						if (!window.escTip && !$.isTouch) {
							escTip = true;
							$('<div />', {'class': 'esc'}).
								html('<div>ESC para voltar</div>').
									appendTo($('body')).
									delay(2000).
									animate({opacity:0}, 500, function() {
										$(this).remove();
									});
						}
					},
					zoomOut: function () {
						$('.esc').hide();
						$('.thumbnails').fadeIn();
						$('.made').fadeIn();
						setTimeout(function(){
							$('.magazine').addClass('animated').removeClass('zoom-in');
							resizeViewport();
							}, 0);
						},
						swipeLeft: function() {
							$('.magazine').turn('next');
						},
						swipeRight: function() {
							$('.magazine').turn('previous');
						}
					}
				});
				// Usa as teclas de seta para virar a página:
				$(document).keydown(function(e){
					var previous = 37, next = 39, esc = 27;
					switch (e.keyCode) {
						case previous:
							// Seta para esquerda
							$('.magazine').turn('previous');
							e.preventDefault();
						break;
						case next:
							//Seta para direita
							$('.magazine').turn('next');
							e.preventDefault();
						break;
						case esc:
							$('.magazine-viewport').zoom('zoomOut');	
							e.preventDefault();
						break;
					}
				});
// ***************** URIs - Formato #/page/1 
				Hash.on('^page\/([0-9]*)$', {
					yep: function(path, parts) {
						var page = parts[1];
						if (page!==undefined) {
							if ($('.magazine').turn('is'))
								$('.magazine').turn('page', page);
						}
					},
					nop: function(path) {
						if ($('.magazine').turn('is'))
							$('.magazine').turn('page', 1);
					}
				});
				$(window).resize(function() {
					resizeViewport();
				}).bind('orientationchange', function() {
					resizeViewport();
				});
				// Eventos para thumbnails:
				$('.thumbnails').click(function(event) {
					var page;
// ***************** Configura as páginas 
					if (event.target && (page=/page-([0-9]+)/.exec($(event.target).attr('class'))) ) {
						$('.magazine').turn('page', page[1]);
					}
				});
				$('.thumbnails li').
					bind($.mouseEvents.over, function() {
						$(this).addClass('thumb-hover');
					}).bind($.mouseEvents.out, function() {
						$(this).removeClass('thumb-hover');
					});
				if ($.isTouch) {
					$('.thumbnails').
						addClass('thumbanils-touch').
						bind($.mouseEvents.move, function(event) {
							event.preventDefault();
						});
					} else {
						$('.thumbnails ul').mouseover(function() {
							$('.thumbnails').addClass('thumbnails-hover');
						}).mousedown(function() {
						return false;
					}).mouseout(function() {
						$('.thumbnails').removeClass('thumbnails-hover');
					});
				}
				// Regions
				if ($.isTouch) {
					$('.magazine').bind('touchstart', regionClick);
				} else {
					$('.magazine').click(regionClick);
				}
				// Eventos para o botão avançar
				$('.next-button').bind($.mouseEvents.over, function() {
					$(this).addClass('next-button-hover');
				}).bind($.mouseEvents.out, function() {
					$(this).removeClass('next-button-hover');
				}).bind($.mouseEvents.down, function() {
					$(this).addClass('next-button-down');
				}).bind($.mouseEvents.up, function() {
					$(this).removeClass('next-button-down');
				}).click(function() {
					$('.magazine').turn('next');
				});
				// Eventos para o botão avançar
				$('.previous-button').bind($.mouseEvents.over, function() {
					$(this).addClass('previous-button-hover');
				}).bind($.mouseEvents.out, function() {
					$(this).removeClass('previous-button-hover');
				}).bind($.mouseEvents.down, function() {
					$(this).addClass('previous-button-down');
				}).bind($.mouseEvents.up, function() {
					$(this).removeClass('previous-button-down');
				}).click(function() {
					$('.magazine').turn('previous');
				});
				resizeViewport();
				$('.magazine').addClass('animated');
			}
			$('#all').hide();
			// Lê a versão HTML4 se lá não houver versão de folha de estilo/CSS:
			yepnope({
				test : Modernizr.csstransforms,
				yep: ['../../lib/turn.min.js'],
				nope: ['../../lib/turn.html4.min.js'],
				both: ['../../lib/zoom.min.js'],
				complete: loadApp
			});
    	</script>
